name: CareerPath CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-lint-and-import:
    name: Backend lint and import
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn pydantic python-dotenv PyPDF2 python-multipart httpx google-genai

      - name: Import backend
        working-directory: backend
        run: python -c "import main; print('OK')"

  backend-route-audit:
    name: Backend frozen route audit
    runs-on: ubuntu-latest
    needs: backend-lint-and-import
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn pydantic python-dotenv PyPDF2 python-multipart httpx google-genai

      - name: Verify frozen routes
        working-directory: backend
        run: |
          python - <<'PY'
          import ast
          import sys

          frozen = {
              "GET /",
              "POST /summarize-cv",
              "POST /generate-interview-question",
              "POST /evaluate-interview-answer",
              "POST /chat",
              "POST /career-dna",
              "POST /readiness-score",
              "POST /explain-match",
          }

          with open("main.py", encoding="utf-8") as f:
              tree = ast.parse(f.read())

          found = set()
          for node in ast.walk(tree):
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              for decorator in node.decorator_list:
                  if not isinstance(decorator, ast.Call):
                      continue
                  func = decorator.func
                  if not (
                      isinstance(func, ast.Attribute)
                      and isinstance(func.value, ast.Name)
                      and func.value.id == "app"
                  ):
                      continue
                  method = func.attr.upper()
                  if method not in {"GET", "POST", "PUT", "DELETE", "PATCH"}:
                      continue
                  if not decorator.args:
                      continue
                  path_arg = decorator.args[0]
                  if isinstance(path_arg, ast.Constant) and isinstance(path_arg.value, str):
                      found.add(f"{method} {path_arg.value}")

          missing = frozen - found
          if missing:
              print("MISSING FROZEN ROUTES:", sorted(missing))
              sys.exit(1)
          print("All frozen routes present")
          PY

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  corpus-validation:
    name: Corpus validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate enriched corpus and embeddings
        run: |
          python - <<'PY'
          import json

          corpus = json.load(open("backend/data/seed_corpus.json", encoding="utf-8"))
          chunks = json.load(open("backend/data/chunks.json", encoding="utf-8"))
          embeddings = json.load(open("backend/data/corpus_embeddings.json", encoding="utf-8"))

          assert len(corpus) == 436, f"Expected 436 corpus items, got {len(corpus)}"
          assert len(chunks) == 648, f"Expected 648 chunks, got {len(chunks)}"
          assert len(embeddings) == 648, f"Expected 648 embeddings, got {len(embeddings)}"

          filled = sum(1 for e in embeddings if e.get("embedding"))
          assert filled == 648, f"Expected 648 filled embeddings, got {filled}"

          print(f"Corpus: {len(corpus)} items")
          print(f"Chunks: {len(chunks)}")
          print(f"Embeddings: {filled}/648 filled")
          print("All corpus checks passed")
          PY

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs:
      - backend-lint-and-import
      - backend-route-audit
      - frontend-build
      - corpus-validation
    if: always()
    steps:
      - name: Report CI result
        run: |
          echo "Backend import: ${{ needs.backend-lint-and-import.result }}"
          echo "Route audit:    ${{ needs.backend-route-audit.result }}"
          echo "Frontend build: ${{ needs.frontend-build.result }}"
          echo "Corpus valid:   ${{ needs.corpus-validation.result }}"

          if [[ "${{ needs.backend-lint-and-import.result }}" != "success" || \
                "${{ needs.backend-route-audit.result }}" != "success" || \
                "${{ needs.frontend-build.result }}" != "success" || \
                "${{ needs.corpus-validation.result }}" != "success" ]]; then
            echo "CI FAILED"
            exit 1
          fi
          echo "CI PASSED"
